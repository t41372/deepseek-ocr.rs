name: Python Bindings CI

on:
  push:
    branches:
      - master
      - "claude/**"
    paths:
      - "crates/python-bindings/**"
      - "crates/core/**"
      - "crates/infer-*/**"
      - ".github/workflows/python-bindings.yml"
  pull_request:
    branches:
      - master
    paths:
      - "crates/python-bindings/**"
      - "crates/core/**"
      - "crates/infer-*/**"
      - ".github/workflows/python-bindings.yml"

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  MIN_PYTHON_VERSION: "3.10"

jobs:
  lint-and-type-check:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/python-bindings

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system ruff mypy pytest

      - name: Run ruff check
        run: ruff check python/ tests/ examples/

      - name: Run ruff format check
        run: ruff format --check python/ tests/ examples/

      - name: Install package stubs
        run: |
          # Install minimal dependencies for type checking
          uv pip install --system pillow numpy

      - name: Run mypy
        run: mypy python/deepseek_ocr
        continue-on-error: true  # Type checking might fail without built extension

  test:
    name: Test on ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    defaults:
      run:
        working-directory: crates/python-bindings

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-python-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-python-

      - name: Install uv
        run: pip install uv

      - name: Install maturin
        run: uv pip install --system maturin

      - name: Build extension (Linux/macOS)
        if: runner.os != 'Windows'
        run: maturin develop --release

      - name: Build extension (Windows)
        if: runner.os == 'Windows'
        run: maturin develop --release
        shell: pwsh

      - name: Install test dependencies
        run: uv pip install --system pytest pytest-cov pillow

      - name: Run unit tests
        run: pytest tests/test_unit.py -v

      - name: Run integration tests (non-slow)
        run: pytest tests/test_integration.py -v -m "not slow"
        continue-on-error: true  # Integration tests may fail without models

  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install maturin
        run: pip install maturin

      - name: Build wheels (Linux)
        if: runner.os == 'Linux'
        working-directory: crates/python-bindings
        run: |
          maturin build --release --strip
          ls -lh target/wheels/

      - name: Build wheels (macOS)
        if: runner.os == 'macOS'
        working-directory: crates/python-bindings
        run: |
          maturin build --release --strip --features metal,accelerate
          ls -lh target/wheels/

      - name: Build wheels (Windows)
        if: runner.os == 'Windows'
        working-directory: crates/python-bindings
        run: |
          maturin build --release --strip
          dir target\wheels\

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: crates/python-bindings/target/wheels/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install maturin
        run: pip install maturin

      - name: Build sdist
        working-directory: crates/python-bindings
        run: maturin sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: crates/python-bindings/target/wheels/*.tar.gz

  publish-release:
    name: Publish to GitHub Release
    if: startsWith(github.ref, 'refs/tags/python-v')
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: wheels

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: wheels

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: wheels/*
          body: |
            Python bindings release for deepseek-ocr.rs

            Install with:
            ```bash
            pip install deepseek-ocr
            ```

            See [CHANGELOG.md](https://github.com/t41372/deepseek-ocr.rs/blob/master/crates/python-bindings/CHANGELOG.md) for details.

