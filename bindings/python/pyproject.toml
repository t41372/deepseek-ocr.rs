[build-system]
requires = ["maturin>=1.6"]
build-backend = "maturin"

[project]
name = "deepseek-ocr"
version = "0.1.0"
description = "Python bindings for the DeepSeek OCR toolkit"
readme = "README.md"
license = { file = "../../LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "DeepSeek", email = "opensource@deepseek.com" }
]
dependencies = [
    "pillow>=10.2",
    "typing-extensions>=4.10",
]

[project.urls]
Homepage = "https://github.com/deepseek-ai/deepseek-ocr.rs"
Documentation = "https://github.com/deepseek-ai/deepseek-ocr.rs/tree/master/bindings/python"

[tool.maturin]
features = ["pyo3/extension-module"]
manifest-path = "Cargo.toml"
module-name = "deepseek_ocr._native"
python-source = "src"

[tool.uv]
dev-dependencies = [
    "maturin>=1.6",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
show_error_codes = true
warn_unused_ignores = true
