[build-system]
requires = ["maturin>=1.6"]
build-backend = "maturin"

[project]
name = "deepseek-ocr-rs"
version = "0.1.0"
description = "Python bindings for TimmyOVO/deepseek-ocr.rs"
readme = "README.md"
license = { file = "../../LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.2",
    "typing-extensions>=4.10",
]

[project.urls]
Homepage = "https://github.com/TimmyOVO/deepseek-ocr.rs"
Documentation = "https://github.com/TimmyOVO/deepseek-ocr.rs/tree/master/bindings/python"

[tool.maturin]
features = ["pyo3/extension-module"]
manifest-path = "Cargo.toml"
module-name = "deepseek_ocr_rs._native"
python-source = "src"

[dependency-groups]
dev = [
    "maturin>=1.6",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.14.7",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "e2e: run real model integration tests (opt-in, requires weights)",
]

[tool.mypy]
python_version = "3.10"
strict = true
show_error_codes = true
warn_unused_ignores = true
