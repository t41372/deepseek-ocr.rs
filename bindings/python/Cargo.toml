[package]
name = "deepseek-ocr-py"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Python bindings for the DeepSeek OCR engines"

[lib]
name = "deepseek_ocr_native"
crate-type = ["cdylib"]

[features]
default = ["mock-engine"]
mock-engine = []

[dependencies]
anyhow = "1.0"
deepseek-ocr-core = { path = "../../crates/core" }
deepseek-ocr-infer-deepseek = { path = "../../crates/infer-deepseek" }
deepseek-ocr-infer-dots = { path = "../../crates/infer-dots" }
deepseek-ocr-infer-paddleocr = { path = "../../crates/infer-paddleocr" }
deepseek-ocr-assets = { path = "../../crates/assets" }
deepseek-ocr-config = { path = "../../crates/config" }
image = { workspace = true, features = ["pnm"] }
once_cell = "1.19"
candle-core = { workspace = true }
pyo3 = { version = "0.21", features = ["extension-module", "abi3-py310"] }
tokenizers = { workspace = true }
tracing = { workspace = true }
ahash = "0.8"

[package.metadata.maturin]
name = "deepseek_ocr_rs._native"
